name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode test

  solver-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/solver-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: services/solver-worker/requirements.txt
      - run: python -m pip install requests==2.32.3
      - run: python -m unittest -v tests/test_overlap_rules.py tests/test_worker_contract.py
      - run: python -m compileall -q .

  contracts-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("contracts/json-schema").glob("*.json"):
              json.loads(path.read_text())
              print("valid", path)
          PY
      - run: docker compose -f infra/compose/docker-compose.m1.yml config
