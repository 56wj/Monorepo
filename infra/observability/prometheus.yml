global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: packing-control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:9100"]

  - job_name: packing-solver-worker
    static_configs:
      - targets: ["solver-worker:9108"]

  - job_name: packing-planning-agent
    metrics_path: /metrics/
    static_configs:
      - targets: ["planning-agent:8200"]
