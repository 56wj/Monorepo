packing-python-api:
  host: ${PYTHON_API_HOST:http://localhost}
  port: ${PYTHON_API_PORT:5000}
  route: /api
  methods: GET
  source_save_path: ${PACKING_DATA_DIR:/tmp/packing}/source/
  result_save_path: ${PACKING_DATA_DIR:/tmp/packing}/result/
  middle_save_path: ${PACKING_DATA_DIR:/tmp/packing}/middle/
  push_save_path: ${PACKING_DATA_DIR:/tmp/packing}/push/
  image_path: ${PACKING_DATA_DIR:/tmp/packing}/images/

spring:
  application:
    name: packing-control-plane
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:db_kindlead}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:packing}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8101}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
  file:
    name: ${LOG_FILE:/tmp/packing/logs/control-plane.log}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=control-plane trace_id=%X{traceId:-none} logger=%logger{36} msg=%msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=control-plane trace_id=%X{traceId:-none} logger=%logger{36} msg=%msg%n"

management:
  server:
    port: ${MANAGEMENT_PORT:9100}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        packing.job.queue.delay: true
        packing.job.execution: true

observability:
  queue-refresh-ms: ${QUEUE_METRICS_REFRESH_MS:15000}

job-queue:
  worker-token: ${JOB_WORKER_TOKEN:local-dev-worker-token}
  default-lease-seconds: ${JOB_LEASE_SECONDS:90}
  max-lease-seconds: ${JOB_MAX_LEASE_SECONDS:300}
  max-attempts: ${JOB_MAX_ATTEMPTS:3}
  retry-base-seconds: ${JOB_RETRY_BASE_SECONDS:10}
  reaper-batch-size: ${JOB_REAPER_BATCH_SIZE:100}
  reaper-interval-ms: ${JOB_REAPER_INTERVAL_MS:30000}
